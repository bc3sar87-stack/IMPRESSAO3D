name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A chave VPS_SSH_KEY tem um "forced command" no authorized_keys da
          # VPS (command="/opt/mjprime/deploy-3dprintcontrol.sh"): por segurança,
          # o sshd ignora o script abaixo e sempre roda apenas esse arquivo fixo,
          # que já faz o pull do site institucional e o deploy do app Next.js.
          script: bash /opt/mjprime/deploy-3dprintcontrol.sh
