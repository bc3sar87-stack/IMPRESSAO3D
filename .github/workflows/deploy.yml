name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "DIAG whoami=$(whoami)"
            echo "DIAG hostname=$(hostname)"
            echo "DIAG public_ip=$(curl -s ifconfig.me || echo unknown)"
            echo "DIAG file_exists=$(test -f /opt/deploy-impressao3d.sh && echo yes || echo no)"
            bash /opt/deploy-impressao3d.sh
